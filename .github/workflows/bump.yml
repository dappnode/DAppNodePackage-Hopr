name: Bump packages
on:
  repository_dispatch:
    types: [bump]
  workflow_dispatch:
    inputs:
      hoprd_version:
        description: 'Version of hoprd to build'
        required: false
permissions:
  contents: read

jobs:
  bump:
    name: Bump docker images
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Bump upstream version
        id: bump
        uses: dappnode/workflows/actions/bump-upstream@master
        with:
          version: ${{ github.event.inputs.hoprd_version || github.event.client_payload.hoprd_version }}
          pin-digest: "true"
          image: ${{ vars.DOCKER_REGISTRY && format('{0}/hoprd', vars.DOCKER_REGISTRY) || '' }}
          # hoprd versions are published as image tags, not GitHub releases.
          provider: docker_tags

      - name: Create Pull Request
        if: steps.bump.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "ci: Update docker images"
          title: "ci: Update hoprd to ${{ steps.bump.outputs.version }}"
          body: |
            This pull request updates the docker images to:
            - hoprd: ${{ steps.bump.outputs.compose-version }}

            This PR was automatically generated by the bump workflow.
          branch: bot/update-${{ github.run_id}}
          delete-branch: true
          assignees: ${{ github.actor }}
          labels: publish-ipfs
          reviewers: "ausias-armesto,tolbrino,NumberFour8,Teebor-Choka,QYuQianchen,jeandemeusy,Jaguaras"
