version: "3.6"
services:
  node:
    # Do not set image field here, it will be set automatically by the sdk.
    build:
      context: .
      args:
        # see https://console.cloud.google.com/artifacts/docker/hoprassociation/europe-west3/docker-images/hoprd
        UPSTREAM_VERSION: 5.0.0-rc.2@sha256:27dc2955d50c6cf74fd716b4714cd70b22c0c2a13a21c191c95988ac26461035
    ports:
      - "1422:1422/udp"
      - "1422:1422/tcp"
      - "3001:3001/tcp"
      - "9091:9091/tcp"
      - "9091:9091/udp"
      - "9092:9092/tcp"
      - "9092:9092/udp"
      - "9093:9093/tcp"
      - "9093:9093/udp"
      - "9094:9094/tcp"
      - "9094:9094/udp"
      - "9095:9095/tcp"
      - "9095:9095/udp"
      - "9096:9096/tcp"
      - "9096:9096/udp"
      - "9097:9097/tcp"
      - "9097:9097/udp"
      - "9098:9098/tcp"
      - "9098:9098/udp"
      - "9099:9099/tcp"
      - "9099:9099/udp"
      - "10000-10100:10000-10100/tcp"
      - "10000-10100:10000-10100/udp"
    volumes:
      - "node-data:/app/hoprd/data"
      - "node-conf:/app/hoprd/conf"
    security_opt:
      - "seccomp:unconfined"
    environment:
      RUST_LOG: info
      HOPRD_CONFIGURATION_FILE_PATH: /app/hoprd/conf/hoprd.cfg.yaml
      HOPRD_IDENTITY: /app/hoprd/conf/hopr.id
      HOPRD_DATA: /app/hoprd/data
      HOPRD_HOST: "127.0.0.1:9091"
      # Count flags, not booleans: "0" = off, "1" = on ("true"/"false" fail to parse).
      HOPRD_ANNOUNCE: "1"
      HOPRD_API: "1"
      HOPRD_API_HOST: "0.0.0.0"
      HOPRD_SAFE_ADDRESS: "0x0000000000000000000000000000000000000000"
      HOPRD_MODULE_ADDRESS: "0x0000000000000000000000000000000000000000"
      HOPRD_PASSWORD: ""
      HOPRD_API_TOKEN: ""
      # Set this to override the value in hoprd.cfg.yaml
      HOPRD_BLOKLI_URL: ""
      HOPRD_SESSION_PORT_RANGE: "10000:10100"
      HOPRD_NAT: "true"
      ADDITIONAL_CMDLINE_ARGS: ""
      ADDITIONAL_ENVIRONMENT_VARS: ""
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
volumes:
  node-data: {}
  node-conf: {}
