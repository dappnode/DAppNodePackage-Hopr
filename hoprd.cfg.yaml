---
blokli_url: https://blokli.piz-palu.gnosisvpn.io
hopr:
  network:
    probe_interval: 30s
    probe_recheck_threshold: 60s
strategy:
  allow_recursive: false
  strategies:
    - AutoRedeeming:
        redeem_on_winning: true
    - ChannelLifecycle:
        population:
          min_open_channels: 5
          target_open_channels: 20
          peer_reopen_cooldown: 30m
        funding:
          initial_capacity: "1 GiB"
          topup_capacity: "512 MiB"
          lower_capacity_threshold: "512 MiB"
        finalizer:
          finalize_max_concurrent: 5
        concurrency:
          max_concurrent_actions: 5
